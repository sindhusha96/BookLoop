{% extends "base.html" %}

{% block title %}Internal Server Error (500) – BookLoop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="p-5 bg-white rounded-4 border card-bookloop shadow-sm">
        <div class="display-1 fw-bold text-danger mb-3">500</div>
        <h3 class="fw-bold text-dark mb-2">Something Went Wrong</h3>
        <p class="text-muted small mb-4">
          An unexpected error occurred while processing your request. Our technical team has been notified.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('main.index') }}" class="btn btn-bookloop-primary">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
