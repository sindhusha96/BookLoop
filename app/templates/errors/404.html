{% extends "base.html" %}

{% block title %}Page Not Found (404) – BookLoop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="p-5 bg-white rounded-4 border card-bookloop shadow-sm">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
        <p class="text-muted small mb-4">
          The page or book listing you are looking for may have been moved, sold, or does not exist.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('main.index') }}" class="btn btn-bookloop-secondary">
            <i class="bi bi-house me-1"></i> Home
          </a>
          <a href="{{ url_for('books.browse') }}" class="btn btn-bookloop-primary">
            <i class="bi bi-search me-1"></i> Browse Books
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
